name: Ard bot

on:
  schedule:
    - cron: "*/10 * * * *"   # 10 минут тутамд
  workflow_dispatch:          # гараар ажиллуулах товч

permissions:
  contents: write

concurrency: ard-bot

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Run bot once
        run: python ard_telegram_bot.py --once
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: Save state
        run: |
          git config user.name "ard-bot"
          git config user.email "ard-bot@users.noreply.github.com"
          git add ard_bot_state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
